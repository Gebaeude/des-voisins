<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Des Voisins</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --accent: #3a7afe;
      --text: #e8eaf0;
      --muted: #9aa1b2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: linear-gradient(180deg, #141828 0%, var(--bg) 100%);
    }
    header h1 { font-size: 2rem; margin-bottom: .5rem; }
    header p { color: var(--muted); }
    main {
      max-width: 2040px;
      margin: 0 auto;
      padding: 1rem 1rem 4rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 360px));
      justify-content: center;
      gap: 1.5rem;
    }
    .video-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .video-card video {
      width: 100%;
      max-width: 360px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: #000;
    }
    .video-info {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .video-info h2 { font-size: 1.1rem; font-weight: 600; }
    .video-info .meta { color: var(--muted); font-size: .85rem; }
    a.download {
      color: var(--accent);
      text-decoration: none;
      font-size: .9rem;
    }
    a.download:hover { text-decoration: underline; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 2rem 1rem;
    }
    .nav-btn { display: none; }
    @media (max-width: 820px) {
      header { padding: 2rem 1rem 1rem; }
      main {
        display: flex;
        position: relative;
        gap: .75rem;
        max-width: none;
        padding: 1rem .75rem 3rem;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
      }
      main::-webkit-scrollbar { display: none; }
      .video-card {
        flex: 0 0 86vw;
        max-width: 420px;
        scroll-snap-align: center;
      }
      .video-card video {
        height: 60vh;
        width: auto;
        max-width: 100%;
      }
      footer { display: none; }
      .nav-btn {
        display: flex;
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.18);
        background: rgba(24,27,36,.85);
        color: var(--text);
        font-size: 1.4rem;
        line-height: 1;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: opacity .25s;
      }
      .nav-btn.hidden { opacity: 0; pointer-events: none; }
      #prev { left: .5rem; }
      #next { right: .5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Des Voisins</h1>
    <p>Drei Aufnahmen zum Anhören</p>
  </header>

  <main>
    <section class="video-card">
      <video controls playsinline preload="metadata" src="videos/fleetwood-mac-landslide.mp4"></video>
      <div class="video-info">
        <div>
          <h2>Fleetwood Mac – Landslide</h2>
        </div>
        <a class="download" href="videos/fleetwood-mac-landslide.mp4" download>Herunterladen</a>
      </div>
    </section>

    <section class="video-card">
      <video controls playsinline preload="metadata" src="videos/beatles-till-there-was-you.mp4"></video>
      <div class="video-info">
        <div>
          <h2>Beatles – Till There Was You</h2>
        </div>
        <a class="download" href="videos/beatles-till-there-was-you.mp4" download>Herunterladen</a>
      </div>
    </section>

    <section class="video-card">
      <video controls playsinline preload="metadata" src="videos/pink-floyd-wish-you-were-here.mp4"></video>
      <div class="video-info">
        <div>
          <h2>Pink Floyd – Wish You Were Here</h2>
        </div>
        <a class="download" href="videos/pink-floyd-wish-you-were-here.mp4" download>Herunterladen</a>
      </div>
    </section>
  </main>

  <button class="nav-btn hidden" id="prev" aria-label="Vorheriges Video">&#8592;</button>
  <button class="nav-btn hidden" id="next" aria-label="Nächstes Video">&#8594;</button>

  <footer>Hosted via GitHub Pages</footer>

  <script>
    const scroller = document.querySelector('main');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let animating = false;
    function cards() {
      return [...scroller.querySelectorAll('.video-card')];
    }
    function currentIndex() {
      const cs = cards();
      const center = scroller.scrollLeft + scroller.clientWidth / 2;
      let best = 0, bestDist = Infinity;
      cs.forEach((c, i) => {
        const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - center);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }
    function update() {
      if (animating) return;
      const i = currentIndex();
      const cs = cards();
      prev.classList.toggle('hidden', i <= 0);
      next.classList.toggle('hidden', i >= cs.length - 1);
    }
    function goTo(i) {
      const cs = cards();
      i = Math.max(0, Math.min(cs.length - 1, i));
      animating = true;
      const card = cs[i];
      const target = card.offsetLeft - (scroller.clientWidth - card.offsetWidth) / 2;
      scroller.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
      const done = () => { animating = false; update(); };
      let last = scroller.scrollLeft;
      let ticks = 0;
      const watch = setInterval(() => {
        ticks++;
        if (scroller.scrollLeft === last || ticks > 40) { clearInterval(watch); requestAnimationFrame(done); }
        last = scroller.scrollLeft;
      }, 50);
    }
    scroller.addEventListener('scroll', () => { if (!animating) update(); }, { passive: true });
    window.addEventListener('resize', update);
    update();
    prev.addEventListener('click', () => goTo(currentIndex() - 1));
    next.addEventListener('click', () => goTo(currentIndex() + 1));
    const vids = document.querySelectorAll('video');
    vids.forEach(v => v.addEventListener('play', () => vids.forEach(o => { if (o !== v) o.pause(); })));
  </script>
</body>
</html>
